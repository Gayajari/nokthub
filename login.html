<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Login — NOKT HUB</title>
<link rel="icon" id="site-favicon" href="https://i.ibb.co.com/nss27bKz/20260716-103634.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  (function(){
    try {
      var c = JSON.parse(localStorage.getItem("nokt_settings_cache") || "null");
      if (c && c.themeColor) {
        document.documentElement.style.setProperty("--accent", c.themeColor);
      }
      if (c && c.siteName) {
        document.write("<style>.site-brand-text,.site-name-inline{visibility:hidden}</style>");
      }
    } catch(e) {}
  })();
</script>

<link rel="stylesheet" href="css/style.css">
<style>
  body{background:#000}
  .nf-header{padding:20px 24px}
  .nf-header .brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .nf-header img{width:36px;height:36px;background:var(--surface);border-radius:6px}
  .nf-header .site-brand-text{
    font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:#fff;
  }

  .nf-wrap{max-width:420px;margin:20px auto 60px;padding:0 24px}
  .nf-wrap h1{font-family:var(--font-display);font-size:2rem;margin-bottom:12px}

  .nf-wrap input{
    width:100%;padding:16px 14px;margin-bottom:14px;background:#000;
    border:1px solid #4d4d4d;border-radius:5px;color:var(--text);font-size:.95rem;
  }
  .nf-wrap input:focus{outline:none;border-color:var(--text)}

  .btn-accent{
    width:100%;padding:14px;border:none;border-radius:5px;background:var(--accent);
    color:#fff;font-weight:700;font-size:1rem;cursor:pointer;margin-top:6px;
  }
  .btn-accent[disabled]{opacity:.6;cursor:not-allowed}

  .nf-divider{
    display:flex;align-items:center;gap:12px;color:var(--text-muted);
    font-size:.82rem;margin:22px 0;
  }
  .nf-divider::before, .nf-divider::after{
    content:"";flex:1;height:1px;background:var(--border);
  }

  .btn-secondary{
    width:100%;padding:13px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-weight:600;font-size:.92rem;
    cursor:pointer;
  }
  .btn-secondary[disabled]{opacity:.6;cursor:not-allowed}

  .nf-link{
    color:var(--text);text-decoration:underline;font-size:.92rem;
    background:none;border:none;cursor:pointer;padding:0;display:block;margin-top:20px;
  }

  .nf-remember{
    display:flex;align-items:center;gap:8px;margin-top:18px;font-size:.88rem;
    color:var(--text-muted);
  }
  .nf-remember input{width:auto;margin:0;accent-color:var(--accent)}

  .nf-switch{margin-top:26px;color:var(--text-muted);font-size:.92rem}
  .nf-switch button{
    background:none;border:none;color:var(--text);font-weight:700;cursor:pointer;
    padding:0;font-size:.92rem;
  }
  .nf-switch .site-brand-text{
    font-size:.92rem;font-weight:700;color:#fff;
  }

  .msg{font-size:.85rem;color:var(--accent);margin-top:14px;min-height:18px}
  .msg.msg-error{color:#ff5c5c}

  #form-register{display:none}

  /* ---------- Lupa sandi ---------- */
  #form-forgot{display:none}
  .nf-forgot-desc{
    color:var(--text-muted);font-size:.9rem;line-height:1.55;margin-bottom:22px;
  }
  .nf-forgot-back{
    color:var(--text-muted);text-decoration:none;font-size:.88rem;
    background:none;border:none;cursor:pointer;padding:0;
    display:flex;align-items:center;gap:6px;margin-top:22px;
  }
  .nf-forgot-back:hover{color:var(--text)}
  .nf-hint{
    color:var(--text-muted);font-size:.8rem;line-height:1.45;margin-top:10px;
  }

  /* ---------- Input password + tombol lihat/sembunyi (ikon mata) ---------- */
  .nf-pw-field{position:relative;margin-bottom:14px}
  .nf-pw-field input{margin-bottom:0;padding-right:48px}
  .nf-pw-toggle{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:6px;display:flex;align-items:center;justify-content:center;
  }
  .nf-pw-toggle:hover{color:var(--text)}
  .nf-pw-toggle svg{width:20px;height:20px;display:block}
  .nf-pw-toggle .eye-off{display:none}
  .nf-pw-toggle.is-visible .eye{display:none}
  .nf-pw-toggle.is-visible .eye-off{display:block}
</style>
</head>
<body>

<header class="nf-header">
  <a href="index.html" class="brand">
    <img id="site-logo-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="NOKT HUB logo">
    <span class="site-brand-text">NOKT HUB</span>
  </a>
</header>

<main class="nf-wrap">

  <!-- ---------- FORM LOGIN ---------- -->
  <div id="form-login">
    <h1>Masuk</h1>

    <input type="email" id="login-email" placeholder="Email" autocomplete="email">

    <div class="nf-pw-field">
      <input type="password" id="login-password" placeholder="Sandi" autocomplete="current-password">
      <button type="button" class="nf-pw-toggle" id="toggle-password" aria-label="Tampilkan sandi">
        <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.86 21.86 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button class="btn-accent" id="btn-login">Masuk</button>

    <div class="nf-divider">ATAU</div>

    <button class="btn-secondary" id="google-login">Login dengan Google</button>

    <button class="nf-link" id="btn-forgot">Lupa sandi?</button>

    <label class="nf-remember">
      <input type="checkbox" id="remember-me">
      Ingat saya
    </label>

    <div class="nf-switch">
      Baru di <span class="site-brand-text">NOKT HUB</span>?
      <button id="tab-register">Daftar sekarang.</button>
    </div>
  </div>

  <!-- ---------- FORM DAFTAR ---------- -->
  <div id="form-register">
    <h1>Daftar Akun</h1>

    <input type="text" id="reg-name" placeholder="Nama" autocomplete="name">
    <input type="email" id="reg-email" placeholder="Email" autocomplete="email">

    <div class="nf-pw-field">
      <input type="password" id="reg-password" placeholder="Sandi" autocomplete="new-password">
      <button type="button" class="nf-pw-toggle" id="toggle-reg-password" aria-label="Tampilkan sandi">
        <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.86 21.86 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button class="btn-accent" id="btn-register">Daftar</button>

    <div class="nf-switch">
      Sudah punya akun?
      <button id="tab-login">Masuk di sini.</button>
    </div>
  </div>

  <!-- ---------- FORM LUPA SANDI ---------- -->
  <div id="form-forgot">
    <h1>Atur Ulang Sandi</h1>
    <p class="nf-forgot-desc">
      Masukkan email akun <span class="site-name-inline">NOKT HUB</span> kamu. Kami akan mengirim link untuk
      mengatur ulang sandi ke email tersebut.
    </p>

    <input type="email" id="forgot-email" placeholder="Email" autocomplete="email">

    <button class="btn-accent" id="btn-send-reset">Kirimi Saya Email</button>

    <p class="nf-hint">Email tidak masuk dalam beberapa menit? Cek folder Spam atau Promosi.</p>

    <button class="nf-forgot-back" id="btn-back-to-login">← Kembali ke Masuk</button>
  </div>

  <div id="auth-msg" class="msg"></div>
</main>

<script>
  window.addEventListener("error", function (e) {
    var m = document.getElementById("auth-msg");
    if (m && !m.textContent) {
      m.textContent = "Terjadi kesalahan teknis saat memuat halaman (" +
        (e.message || "skrip gagal dimuat") +
        "). Coba refresh, atau hubungi admin kalau terus terjadi.";
      m.classList.add("msg-error");
    }
  });
  window.addEventListener("unhandledrejection", function (e) {
    var m = document.getElementById("auth-msg");
    if (m && !m.textContent) {
      m.textContent = "Terjadi kesalahan teknis: " +
        (e.reason && e.reason.message ? e.reason.message : "proses gagal") +
        ". Coba refresh, atau hubungi admin kalau terus terjadi.";
      m.classList.add("msg-error");
    }
  });
</script>

<script type="module">
import { loginWithGoogle, loginWithEmail, registerWithEmail, resetPassword, watchAuthState, setLoginPersistence } from "./js/auth.js";

const msg = document.getElementById("auth-msg");

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : "";
  const map = {
    "auth/wrong-password": "Email atau sandi salah.",
    "auth/user-not-found": "Akun dengan email ini tidak ditemukan.",
    "auth/invalid-credential": "Email atau sandi salah.",
    "auth/invalid-login-credentials": "Email atau sandi salah.",
    "auth/email-already-in-use": "Email ini sudah terdaftar. Coba masuk, atau pakai email lain.",
    "auth/weak-password": "Sandi terlalu lemah, minimal 6 karakter.",
    "auth/invalid-email": "Format email tidak valid.",
    "auth/missing-email": "Isi email dulu.",
    "auth/missing-password": "Isi sandi dulu.",
    "auth/too-many-requests": "Terlalu banyak percobaan gagal. Coba lagi beberapa saat lagi.",
    "auth/popup-closed-by-user": "Popup login Google ditutup sebelum selesai.",
    "auth/cancelled-popup-request": "Popup login Google dibatalkan.",
    "auth/network-request-failed": "Gagal terhubung ke server. Cek koneksi internet kamu.",
    "auth/user-disabled": "Akun ini telah dinonaktifkan."
  };
  return map[code] || (err && err.message ? err.message : "Terjadi kesalahan, coba lagi.");
}

const setMsg = (t, isError) => {
  msg.textContent = t;
  msg.classList.toggle("msg-error", !!isError);
};

function withLoadingState(btn, fn) {
  return async (...args) => {
    if (btn.disabled) return;
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Memproses...";
    try {
      await fn(...args);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  };
}

watchAuthState((user) => {
  if (user) window.location.href = "index.html";
});

const loginEmailInput = document.getElementById("login-email");
const rememberBox = document.getElementById("remember-me");
try {
  const rememberedEmail = localStorage.getItem("nokt_remember_email");
  if (rememberedEmail) {
    loginEmailInput.value = rememberedEmail;
    rememberBox.checked = true;
  }
} catch (e) {}

// ---------- Ganti tampilan (login / daftar / lupa sandi) ----------
function showView(id) {
  document.getElementById("form-login").style.display = "none";
  document.getElementById("form-register").style.display = "none";
  document.getElementById("form-forgot").style.display = "none";
  document.getElementById(id).style.display = "block";
  setMsg("");
}

document.getElementById("tab-register").addEventListener("click", () => showView("form-register"));
document.getElementById("tab-login").addEventListener("click", () => showView("form-login"));

// ---------- Tombol lihat/sembunyi sandi ----------
function wirePasswordToggle(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  btn.addEventListener("click", () => {
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    btn.classList.toggle("is-visible", isHidden);
    btn.setAttribute("aria-label", isHidden ? "Sembunyikan sandi" : "Tampilkan sandi");
  });
}
wirePasswordToggle("login-password", "toggle-password");
wirePasswordToggle("reg-password", "toggle-reg-password");

// ---------- Login Google ----------
const googleBtn = document.getElementById("google-login");
googleBtn.addEventListener("click", withLoadingState(googleBtn, async () => {
  try {
    await loginWithGoogle();
    window.location.href = "index.html";
  } catch (e) {
    setMsg(friendlyAuthError(e), true);
  }
}));

// ---------- Login email/sandi ----------
const loginBtn = document.getElementById("btn-login");
loginBtn.addEventListener("click", withLoadingState(loginBtn, async () => {
  const email = loginEmailInput.value.trim();
  const password = document.getElementById("login-password").value;
  if (!email || !password) { setMsg("Isi email dan sandi dulu.", true); return; }

  try {
    // "Ingat saya": kalau dicentang, sesi tetap login walau browser ditutup.
    // Kalau tidak dicentang, otomatis logout saat tab/browser ditutup.
    await setLoginPersistence(rememberBox.checked);

    await loginWithEmail(email, password);
    try {
      if (rememberBox.checked) localStorage.setItem("nokt_remember_email", email);
      else localStorage.removeItem("nokt_remember_email");
    } catch (e) {}
    window.location.href = "index.html";
  } catch (e) {
    setMsg(friendlyAuthError(e), true);
  }
}));

// ---------- Daftar ----------
const registerBtn = document.getElementById("btn-register");
registerBtn.addEventListener("click", withLoadingState(registerBtn, async () => {
  const name = document.getElementById("reg-name").value.trim();
  const email = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-password").value;
  if (!name || !email || !password) { setMsg("Isi nama, email, dan sandi dulu.", true); return; }

  try {
    await registerWithEmail(email, password, name);
    setMsg("Berhasil daftar! Cek email untuk verifikasi (termasuk folder Spam jika tidak terlihat).", false);
  } catch (e) {
    setMsg(friendlyAuthError(e), true);
  }
}));

// ---------- Lupa sandi ----------
document.getElementById("btn-forgot").addEventListener("click", () => {
  document.getElementById("forgot-email").value = loginEmailInput.value.trim();
  showView("form-forgot");
});

document.getElementById("btn-back-to-login").addEventListener("click", () => showView("form-login"));

const sendResetBtn = document.getElementById("btn-send-reset");
sendResetBtn.addEventListener("click", withLoadingState(sendResetBtn, async () => {
  const email = document.getElementById("forgot-email").value.trim();
  if (!email) { setMsg("Isi email dulu untuk reset sandi.", true); return; }
  try {
    await resetPassword(email);
    setMsg("Link reset sandi sudah dikirim ke email kamu. Tidak muncul? Cek folder Spam/Promosi.", false);
  } catch (e) {
    setMsg(friendlyAuthError(e), true);
  }
}));
</script>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
