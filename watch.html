<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">NOKT HUB — Tonton Video</title>
<meta id="meta-desc" name="description" content="">
<meta name="theme-color" content="#0A0A0B">
<link rel="canonical" id="canonical-link" href="">

<!-- Anti-flash: terapkan warna tema tersimpan SEBELUM halaman digambar,
     supaya tidak kelihatan "kedip" oranye default sebelum berganti ke
     warna yang diset admin. Diisi otomatis oleh js/app.js tiap kunjungan. -->
<script>
  (function(){
    try {
      var c = JSON.parse(localStorage.getItem('nokt_settings_cache') || 'null');
      if (c && c.themeColor) {
        document.documentElement.style.setProperty('--accent', c.themeColor);
      }
      if (c && c.siteName) {
        document.write('<style>.site-brand-text,.site-name-inline{visibility:hidden}</style>');
      }
      var authCache = JSON.parse(localStorage.getItem('nokt_auth_cache') || 'null');
      if (authCache) {
        document.write('<style>#login-btn,#profile-btn{visibility:hidden}</style>');
      }
    } catch(e) {}
  })();
</script>
<meta property="og:title" id="og-title" content="">
<meta property="og:description" id="og-desc" content="">
<meta property="og:image" id="og-image" content="">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json" id="json-ld"></script>
<style>
  #btn-scroll-top{
    position:fixed;right:20px;bottom:24px;z-index:80;
    width:44px;height:44px;border-radius:50%;
    background:var(--accent);color:#0A0A0B;border:none;
    display:none;align-items:center;justify-content:center;
    font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);
    transition:opacity .2s, transform .2s;
  }
  #btn-scroll-top:hover{transform:translateY(-2px)}
  #btn-scroll-top.visible{display:flex}
  #btn-scroll-top svg{display:block}
  #btn-scroll-top:hover svg{transform:translateY(-2px)}

  /* ---- Icon buttons (like video) ---- */
  .icon-btn{display:inline-flex;align-items:center;gap:6px}
  .icon-btn svg{transition:transform .15s ease, fill .15s ease, color .15s ease}
  .icon-btn:hover svg{transform:scale(1.15)}
  .icon-btn.is-active{color:var(--accent)}
  .icon-btn.is-active svg{fill:var(--accent);stroke:var(--accent)}

  /* ---- Comment reactions (like/dislike) ---- */
  .comment-react{
    display:inline-flex;align-items:center;gap:4px;cursor:pointer;
    color:var(--text-muted);transition:color .15s ease;user-select:none;
  }
  .comment-react svg{transition:transform .15s ease, fill .15s ease}
  .comment-react:hover svg{transform:scale(1.2)}
  .comment-react.is-active{color:var(--accent)}
  .comment-react.is-active svg{fill:var(--accent);stroke:var(--accent)}
  .comment-react.is-disabled{pointer-events:none;opacity:.6}

  #comment-input:disabled{opacity:.5;cursor:not-allowed}
  #btn-comment:disabled{opacity:.5;cursor:not-allowed}

  #sort-newest.active, #sort-oldest.active{
    background:var(--accent);color:#0A0A0B;border-color:var(--accent)
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row container">
    <a href="index.html" class="brand">
      <img id="site-logo-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="NOKT HUB logo" style="width:32px;height:32px;background:var(--surface);border-radius:6px">
      <span class="site-brand-text">NOKT HUB</span> <span class="dot"></span>
    </a>
    <a href="index.html" class="nav-btn">Home</a>
    <div class="search-wrap">
      <input id="search-input" class="search-input" type="text" placeholder="Cari judul, tag, kategori...">
      <div id="search-results" class="search-results"></div>
    </div>
    <button id="login-btn" class="btn">Login</button>
    <div id="profile-btn" class="profile-btn nav-btn" style="display:none;cursor:pointer"></div>
  </div>
</header>

<main class="container watch-layout">
  <div id="watch-col">
    <div id="player-container" class="player-wrap"></div>

    <!-- video-meta: bagian ini yang akan "ketutup" (fade) sementara pas kolom komentar difokus -->
    <div id="video-meta">
      <h1 id="video-title" class="video-title">Memuat...</h1>
      <div class="video-stats">
        <span id="stat-views">0 view</span>
        <span id="stat-likes">0 like</span>
        <span id="stat-date">-</span>
      </div>

      <div class="share-row">
        <button class="share-btn icon-btn" id="btn-like">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10v12"/>
            <path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>
          </svg>
          <span>Suka</span>
        </button>
        <button class="share-btn" data-share="copy">Copy Link</button>
        <button class="share-btn" data-share="whatsapp">WhatsApp</button>
        <button class="share-btn" data-share="telegram">Telegram</button>
        <button class="share-btn" data-share="facebook">Facebook</button>
        <button class="share-btn" data-share="twitter">Twitter/X</button>
        <button class="share-btn" data-share="native">Bagikan</button>
      </div>

      <p id="video-desc" style="color:var(--text-muted);margin:10px 0"></p>
      <div id="video-category" style="margin:6px 0"></div>
      <div id="video-tags"></div>
    </div>

    <section style="margin-top:30px">
      <h2 style="font-family:var(--font-display);margin-bottom:12px">Komentar</h2>

      <!-- Placeholder: menjaga tinggi ruang saat comment-box berubah jadi position:fixed,
           biar konten di bawahnya (count/sort/list) gak "loncat" ke atas -->
      <div id="comment-box-placeholder"></div>

      <div class="comment-box">
        <textarea id="comment-input" placeholder="Tulis komentar..." disabled></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <button class="btn" id="btn-comment" disabled>Kirim</button>
          <span id="comment-login-hint" style="font-size:.8rem;color:var(--text-muted)">
            <a href="login.html" style="color:var(--accent)">Login</a> dulu untuk berkomentar
          </span>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
        <span style="font-size:.8rem;color:var(--text-muted)" id="comment-count">0 komentar</span>
        <div style="display:flex;gap:6px">
          <button class="share-btn" id="sort-newest" data-sort="desc">Terbaru</button>
          <button class="share-btn" id="sort-oldest" data-sort="asc">Terlama</button>
        </div>
      </div>
      <div id="comment-list" style="margin-top:12px"></div>
    </section>
  </div>

  <aside>
    <h2 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:12px">Video Terkait</h2>
    <div id="related-list" style="display:flex;flex-direction:column;gap:12px"></div>
  </aside>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <a href="index.html" class="brand site-brand-text" style="margin-bottom:8px;display:inline-block;text-decoration:none">NOKT HUB</a>
      <p>© 2026 <span class="site-name-inline">NOKT HUB</span>. Semua konten milik pemilik hak cipta masing-masing.</p>
    </div>
    <div class="footer-links">
      <a href="contact.html">Kontak</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms</a>
      <a href="dmca.html">DMCA</a>
      <a href="disclaimer.html">Disclaimer</a>
    </div>
  </div>
</footer>

<button id="btn-scroll-top" type="button" aria-label="Kembali ke atas / posisi video">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/watch.js"></script>
<script>
  // Tombol scroll-to-top: muncul setelah scroll agak jauh, klik balik ke atas (posisi video player)
  const scrollBtn = document.getElementById('btn-scroll-top');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });
  scrollBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
