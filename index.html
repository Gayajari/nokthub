<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakultind — Galeri Foto &amp; Link</title>
<meta name="description" content="Yakultind — kumpulan foto dan link terbaru, ditata rapi dan mudah dicari.">
<meta name="keywords" content="yakultind, galeri foto, kumpulan link, foto dan link">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span data-i18n="home">Home</span>
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off" data-i18n-placeholder="search_placeholder">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<script>
  /* Menghitung tinggi header secara dinamis untuk offset sticky baris
     chips + tabs (.sticky-bars). Hanya urusan tampilan — tidak menyentuh
     data, routing, atau fungsi lain. */
  (function(){
    var headerEl = document.querySelector('.site-header');
    function setHeaderHeight(){
      document.documentElement.style.setProperty('--header-h', headerEl.getBoundingClientRect().height + 'px');
    }
    setHeaderHeight();
    window.addEventListener('resize', setHeaderHeight);
    window.addEventListener('load', setHeaderHeight);
    if(window.ResizeObserver){
      new ResizeObserver(setHeaderHeight).observe(headerEl);
    }
  })();
</script>

<div class="nav-row" id="nav-row"></div>

<main class="wrap">
  <div class="sticky-bars" id="sticky-bars">
    <div class="chips" id="chips"></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-sort="baru" data-i18n="terbaru">Terbaru</button>
      <button class="tab" data-sort="lama" data-i18n="terlama">Terlama</button>
      <button class="tab" data-sort="populer" data-i18n="terpopuler">Terpopuler</button>
    </div>
  </div>

  <div class="ad-slot" data-ad="native"></div>

  <div id="grid"></div>
  <div class="pagination" id="pagination"></div>

  <div class="ad-slot" data-ad="banner250"></div>
</main>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="ads.js"></script>
<script src="site.js"></script>
<script>
  let allPosts = [];
  let currentCategory = 'Semua';
  let currentSort = 'baru';
  let currentSearch = '';
  let currentPage = 1;

  function getFilteredList(){
    let list = [...allPosts];
    if(currentCategory !== 'Semua') list = list.filter(p => (p.kategori || 'Umum') === currentCategory);
    if(currentSearch){
      const q = currentSearch.toLowerCase();
      list = list.filter(p =>
        (p.judul || '').toLowerCase().includes(q) ||
        (p.kategori || '').toLowerCase().includes(q) ||
        (p.tags || '').toLowerCase().includes(q)
      );
    }
    list.sort((a,b) => {
      if(currentSort === 'populer') return (b.views || 0) - (a.views || 0);
      return currentSort === 'baru'
        ? new Date(b.dibuat_pada) - new Date(a.dibuat_pada)
        : new Date(a.dibuat_pada) - new Date(b.dibuat_pada);
    });
    return list;
  }

  function cardHtml(p){
    const photos = p.foto_urls || [];
    const cover = photos[0] || '';
    return `
      <article class="card">
        <a class="thumb" href="/watch/${p.short_code || p.slug || p.id}">
          <span class="cat-tag">${escapeHtml(p.kategori || 'Umum')}</span>
          ${photos.length > 1 ? `<span class="count">${photos.length} ${window.t ? t('foto') : 'foto'}</span>` : ''}
          <img src="${cover}" alt="${escapeHtml(p.judul)}" loading="lazy">
        </a>
        <div class="card-body">
          <h3><a href="/watch/${p.short_code || p.slug || p.id}">${escapeHtml(p.judul)}</a></h3>
          <div class="card-footer">
            <div class="card-meta">
              <span class="date">${fmtDate(p.dibuat_pada)}</span>
            </div>
            <a class="btn-pill" href="/watch/${p.short_code || p.slug || p.id}">${window.t ? t('lihat') : 'Lihat'}</a>
          </div>
        </div>
      </article>`;
  }

  function renderPosts(){
    const grid = document.getElementById('grid');
    const list = getFilteredList();

    if(!list.length){
      grid.innerHTML = '<div class="empty">Belum ada post yang cocok.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const totalPages = Math.max(1, Math.ceil(list.length / POSTS_PER_PAGE));
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const pageItems = list.slice(start, start + POSTS_PER_PAGE);

    grid.innerHTML = pageItems.map(cardHtml).join('');
    renderPagination(document.getElementById('pagination'), list.length, currentPage, (p) => {
      currentPage = p;
      renderPosts();
      saveState();
      window.scrollTo({ top: document.getElementById('grid').offsetTop - 80, behavior:'smooth' });
    });
    saveState();
  }

  function renderChips(){
    const cats = [...new Set(allPosts.map(p => p.kategori || 'Umum'))];
    document.getElementById('chips').innerHTML = `
      <button class="chip ${currentCategory === 'Semua' ? 'active':''}" data-cat="Semua">${window.t ? t('semua') : 'Semua'}</button>
      <div class="chips-scroll" id="chips-scroll">
        ${cats.map(c =>
          `<button class="chip ${c === currentCategory ? 'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
        ).join('')}
      </div>
    `;
    document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
      currentCategory = btn.dataset.cat;
      currentPage = 1;
      renderChips(); renderPosts();
    }));
  }

  function saveState(){
    cacheSetState({ category: currentCategory, sort: currentSort, page: currentPage });
  }

  window.onSearchChange = function(q){
    currentSearch = q;
    currentPage = 1;
    // Search harus lintas-kategori: kalau ada kata kunci, jangan dibatasi
    // chip yang sedang aktif — reset ke Semua supaya hasilnya global.
    if(q && q.trim()){
      currentCategory = 'Semua';
      renderChips();
    }
    renderPosts();
  };

  // Enter/tombol search di keyboard: selama ini form melakukan submit standar
  // (reload halaman) karena tidak dicegah — sekarang dicegah dan langsung jalankan pencarian.
  const searchFormEl = document.getElementById('global-search-form');
  const searchInputEl = document.getElementById('global-search-input');
  let forceGlobalSearch = false;
  if(searchFormEl && searchInputEl){
    searchFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      onSearchChange(searchInputEl.value.trim());
      searchInputEl.blur();
    }, true);
    // Kalau dibuka dari halaman lain lewat index.html?search=..., isi otomatis
    const searchFromUrl = new URLSearchParams(location.search).get('search');
    if(searchFromUrl){
      searchInputEl.value = searchFromUrl;
      document.getElementById('search-panel').classList.add('open');
      document.getElementById('search-toggle').setAttribute('aria-expanded', 'true');
      currentSearch = searchFromUrl;
      forceGlobalSearch = true; // dipakai di loadPosts() supaya tidak ketimpa kategori dari cache
    }
  }

  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    currentPage = 1;
    renderPosts();
  }));

  // Tombol Home di header index.html sendiri: reset kategori ke Semua.
  // Kategori terakhir tetap tersimpan untuk tombol Home di halaman watch/detail,
  // jadi klik pertama dari sana balik ke kategori yang sedang dibuka, dan klik
  // kedua (dari index.html) baru balik ke home asli (Semua).
  const homeBtnTop = document.querySelector('.header-top .home-btn');
  if(homeBtnTop){
    homeBtnTop.addEventListener('click', () => {
      cacheSetState({ category: 'Semua', sort: currentSort, page: 1 });
    });
  }

  async function loadPosts(){
    const grid = document.getElementById('grid');
    const cached = cacheGetPosts();
    const state = cacheGetState();
    if(state){
      currentCategory = state.category || 'Semua';
      currentSort = state.sort || 'baru';
      currentPage = state.page || 1;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sort === currentSort));
    }
    if(forceGlobalSearch) currentCategory = 'Semua';

    if(cached && cached.posts.length){
      allPosts = cached.posts;
      renderChips();
      renderPosts();
    } else {
      grid.innerHTML = skeletonGridHtml(8);
    }

    try{
      const { data, error } = await sb.from('posts').select('*').order('dibuat_pada', { ascending:false });
      if(error) throw error;
      allPosts = data || [];
      cacheSetPosts(allPosts);
      renderChips();
      renderPosts();
    } catch(err){
      if(!cached || !cached.posts.length){
        grid.innerHTML = errorStateHtml('loadPosts');
        document.getElementById('pagination').innerHTML = '';
      }
      // jika cache tersedia, biarkan data cache tetap tampil meski refresh terbaru gagal
    }
  }
  loadPosts();
</script>

<div id="ad-sticky-mount"></div>
</body>
</html>
